<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - MISpal</title>
    <link rel="icon" href="/mispal-logo.png" type="image/png">
    <link rel="shortcut icon" href="/mispal-logo.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .login-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            margin-bottom: 2rem;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.3s ease;
        }

        .login-back-btn:hover {
            transform: translateX(-4px);
        }

        .login-card {
            background: white;
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-school-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .login-school-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            overflow: hidden;
        }

        .login-school-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-school-name {
            flex: 1;
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a202c;
        }

        .login-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-header h2 {
            font-size: 1.875rem;
            color: #1a202c;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #718096;
            font-size: 0.95rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-weight: 600;
            color: #2d3748;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group label i {
            width: 16px;
            color: #667eea;
        }

        .input-group input,
        .input-group select {
            padding: 0.875rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login-submit {
            padding: 0.875rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login-submit:active {
            transform: translateY(0);
        }

        .btn-login-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-divider {
            text-align: center;
            color: #a0aec0;
            margin: 2rem 0;
            font-size: 0.85rem;
            position: relative;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e2e8f0;
        }

        .login-divider::before {
            left: 0;
        }

        .login-divider::after {
            right: 0;
        }

        .quick-login-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .quick-login-btn {
            padding: 0.75rem;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .quick-login-btn i {
            width: 20px;
            text-align: center;
            color: #667eea;
        }

        .quick-login-btn:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
            transform: translateX(2px);
        }

        .role-info {
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 0.5rem;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff30;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login-submit.loading .loading-spinner {
            display: block;
        }

        .btn-login-submit.loading span {
            display: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }

            .login-header h2 {
                font-size: 1.5rem;
            }

            .quick-login-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <a class="login-back-btn" onclick="window.location.pathname = '/selector'">
            <i class="fas fa-arrow-left"></i> Back to Schools
        </a>
        
        <div class="login-card">
            <div class="login-school-info">
                <div class="login-school-logo">
                    <img src="/mispal-logo.png" alt="School Logo" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="login-school-name" id="school-name">St. Patrick's Comprehensive</div>
            </div>
            
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>

            <div class="error-message" id="error-msg"></div>
            <div class="success-message" id="success-msg"></div>
            
            <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Select Your Role</label>
                    <select id="login-role" required onchange="updateRoleInfo()">
                        <option value="">-- Choose your role --</option>
                        <option value="admin">Administrator</option>
                        <option value="principal">Principal</option>
                        <option value="secretary">Secretary</option>
                        <option value="teacher">Teacher</option>
                        <option value="parent">Parent</option>
                        <option value="student">Student</option>
                    </select>
                    <div class="role-info" id="role-info"></div>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="login-email" placeholder="your.email@school.ie" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> PIN Code</label>
                    <input type="password" id="login-pin" placeholder="Enter your PIN" maxlength="6" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-login-submit">
                    <div class="loading-spinner"></div>
                    <span><i class="fas fa-sign-in-alt"></i> Sign In</span>
                </button>
            </form>
            
            <div class="login-divider">Quick Login (Demo)</div>
            
            <div class="quick-login-grid">
                <button type="button" class="quick-login-btn" onclick="quickLogin('admin@schoolware.com', '1234', 'admin')">
                    <i class="fas fa-user-tie"></i>
                    <span>Admin (admin@schoolware.com)</span>
                </button>
                <button type="button" class="quick-login-btn" onclick="quickLogin('john.smith@schoolware.com', '1234', 'teacher')">
                    <i class="fas fa-chalkboard-teacher"></i>
                    <span>Teacher (john.smith@schoolware.com)</span>
                </button>
                <button type="button" class="quick-login-btn" onclick="quickLogin('james.wilson@student.schoolware.com', '1234', 'student')">
                    <i class="fas fa-user-graduate"></i>
                    <span>Student (james.wilson@schoolware.com)</span>
                </button>
                <button type="button" class="quick-login-btn" onclick="quickLogin('parent.wilson@email.com', '1234', 'parent')">
                    <i class="fas fa-user-friends"></i>
                    <span>Parent (parent.wilson@email.com)</span>
                </button>
                <button type="button" class="quick-login-btn" onclick="quickLogin('mary.johnson@schoolware.com', '1234', 'secretary')">
                    <i class="fas fa-headset"></i>
                    <span>Secretary (mary.johnson@schoolware.com)</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const schoolName = "St. Patrick's Comprehensive";
        const apiBaseUrl = '/api';

        function updateRoleInfo() {
            const role = document.getElementById('login-role').value;
            const infoEl = document.getElementById('role-info');
            
            const roleInfo = {
                admin: 'Full system access with administrative powers',
                principal: 'Principal access to all school data and reports',
                secretary: 'Administrative and secretarial functions',
                teacher: 'Access to your classes and student information',
                parent: 'View your child\'s academic progress and attendance',
                student: 'Access your timetable, assignments, and grades'
            };

            infoEl.textContent = roleInfo[role] || '';
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const pin = document.getElementById('login-pin').value;
            const role = document.getElementById('login-role').value;
            const submitBtn = document.querySelector('.btn-login-submit');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            if (!role) {
                showError('Please select your role');
                return;
            }

            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${apiBaseUrl}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password: pin,
                        role
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Login failed. Please try again.');
                    return;
                }

                // Store token
                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', role);
                localStorage.setItem('userId', data.user._id);
                localStorage.setItem('userName', `${data.user.firstName} ${data.user.lastName}`);

                successMsg.textContent = 'Login successful! Redirecting...';
                successMsg.classList.add('show');

                // Redirect based on role
                setTimeout(() => {
                    window.location.pathname = '/shannoncomp/dashboard';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please try again.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        async function quickLogin(email, pin, role) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-pin').value = pin;
            document.getElementById('login-role').value = role;
            updateRoleInfo();
            
            // Simulate form submission
            const form = document.getElementById('login-form');
            const event = new Event('submit', { bubbles: true });
            form.dispatchEvent(event);
        }

        function showError(message) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
            
            setTimeout(() => {
                errorMsg.classList.remove('show');
            }, 5000);
        }

        // Set school name from URL if available
        window.addEventListener('load', () => {
            const pathParts = window.location.pathname.split('/');
            if (pathParts[1]) {
                document.getElementById('school-name').textContent = schoolName;
            }
        });
    </script>
</body>
</html>
