<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Select Your School - MISpal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .selector-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .selector-container {
            max-width: 1200px;
            width: 100%;
        }

        .selector-header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }

        .selector-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .selector-header .logo-icon {
            width: 60px;
            height: 60px;
        }

        .selector-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .school-card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .school-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .school-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .school-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .school-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 0.5rem;
        }

        .school-location {
            color: #718096;
            margin-bottom: 1.5rem;
        }

        .school-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #edf2f7;
        }

        @media (max-width: 768px) {
            .selector-header h1 {
                font-size: 2rem;
            }

            .schools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="selector-page">
        <div class="selector-container">
            <div class="selector-header">
                <h1>
                    <img src="/mispal-logo.png" alt="MISpal" class="logo-icon" style="width: 60px; height: 60px; border-radius: 12px; background: white; padding: 8px;">
                    Select Your School
                </h1>
                <p>Choose your school to access the Management Information System</p>
            </div>

            <div class="schools-grid" id="schools-grid">
                <!-- Schools will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const schools = [
            {
                id: 'shannoncomp',
                name: "St. Patrick's Comprehensive School",
                location: 'Shannon, Co. Clare',
                logo: 'https://via.placeholder.com/120/667eea/ffffff?text=SPC',
                color: '#667eea'
            }
        ];

        function loadSchools() {
            const grid = document.getElementById('schools-grid');
            
            grid.innerHTML = schools.map(school => `
                <div class="school-card" style="border-top: 4px solid ${school.color}">
                    <div class="school-logo" style="background: linear-gradient(135deg, ${school.color} 0%, ${school.color}dd 100%)">
                        <img src="${school.logo}" alt="${school.name}">
                    </div>
                    <h2 class="school-name">${school.name}</h2>
                    <p class="school-location">
                        <i class="fas fa-map-marker-alt"></i> ${school.location}
                    </p>
                    <div class="school-actions">
                        <a href="/shannoncomp/login" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Staff Login
                        </a>
                        <a href="/shannoncomp/enrolment" class="btn btn-secondary">
                            <i class="fas fa-user-plus"></i> Enrol
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Load schools on page load
        document.addEventListener('DOMContentLoaded', loadSchools);
    </script>
</body>
</html>
