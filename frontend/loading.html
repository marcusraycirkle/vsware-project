<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - MISpal</title>
    <link rel="icon" href="/mispal-logo.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .fallback-loader {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .fallback-loader.show {
            display: flex;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        .text {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            video {
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <video id="loading-video" playsinline autoplay muted>
            <source src="/loadingtest.MP4" type="video/mp4">
        </video>
        
        <!-- Fallback loader if video doesn't load -->
        <div class="fallback-loader" id="fallback-loader">
            <div class="logo">
                <img src="/mispal-logo.png" alt="MISpal" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="text">Loading MISpal...</div>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('loading-video');
        const fallbackLoader = document.getElementById('fallback-loader');
        let videoEnded = false;
        let videoLoaded = false;

        // Handle video end
        video.addEventListener('ended', () => {
            videoEnded = true;
            redirectToLanding();
        });

        // Handle video error (fallback if video not found)
        video.addEventListener('error', () => {
            fallbackLoader.classList.add('show');
            // Wait 3 seconds then redirect
            setTimeout(redirectToLanding, 3000);
        });

        // Handle video metadata loaded
        video.addEventListener('loadedmetadata', () => {
            videoLoaded = true;
            // If video is very short or already played, redirect after a moment
            if (video.duration && video.duration < 1) {
                setTimeout(redirectToLanding, 1000);
            }
        });

        // Handle can play
        video.addEventListener('canplay', () => {
            video.play().catch(err => {
                console.log('Autoplay failed, showing fallback:', err);
                fallbackLoader.classList.add('show');
                setTimeout(redirectToLanding, 3000);
            });
        });

        // Timeout failsafe - if nothing happens in 15 seconds, go to landing page
        setTimeout(() => {
            if (!videoEnded) {
                redirectToLanding();
            }
        }, 15000);

        function redirectToLanding() {
            // Check if user came from a refresh/back navigation
            if (sessionStorage.getItem('loadingShown')) {
                // Already showed loading once this session, skip to home
                window.location.pathname = '/home';
                return;
            }
            
            // Mark that we showed loading
            sessionStorage.setItem('loadingShown', 'true');
            
            // Redirect to home/landing page
            window.location.pathname = '/home';
        }

        // Start playback immediately
        window.addEventListener('load', () => {
            // If video is ready and hasn't played yet, play it
            if (video.readyState >= 2) {
                video.play().catch(err => {
                    console.log('Autoplay prevention, showing fallback');
                    fallbackLoader.classList.add('show');
                    setTimeout(redirectToLanding, 3000);
                });
            }
        });
    </script>
</body>
</html>
