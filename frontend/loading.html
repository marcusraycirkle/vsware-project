<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - MISpal</title>
    <link rel="icon" href="/mispal-logo.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
        }

        .loading-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .fallback-loader {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .fallback-loader.show {
            display: flex;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-top: 2rem;
        }

        .text {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            video {
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <video id="loading-video" playsinline autoplay muted>
            <source src="/videoloadtest2.MP4" type="video/mp4">
        </video>
        
        <!-- Fallback loader if video doesn't load -->
        <div class="fallback-loader" id="fallback-loader">
            <div class="logo">
                <img src="/mispal-logo.png" alt="MISpal" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="text">Loading MISpal...</div>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Stop video at 1.2 seconds
        const video = document.getElementById('loading-video');
        if (video) {
            video.addEventListener('timeupdate', function() {
                if (this.currentTime >= 1.2) {
                    this.pause();
                }
            });
            
            // Show fallback if video fails to load
            video.addEventListener('error', function() {
                document.getElementById('fallback-loader').classList.add('show');
            });
        }
    </script>
    <script src="/loading-screen.js"></script>
</body>
</html>
