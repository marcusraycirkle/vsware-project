version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: schoolware-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: schoolware
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - schoolware-network

  api:
    build: .
    container_name: schoolware-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/schoolware
      - PORT=5000
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - schoolware-network
    command: npm run dev

volumes:
  mongodb_data:
    driver: local

networks:
  schoolware-network:
    driver: bridge
